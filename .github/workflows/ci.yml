name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d todo_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: Server

    env:
      NODE_ENV: test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: todo_db
      DB_HOST: localhost
      DB_PORT: 5432
      JWT_SECRET: test-secret-for-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check src/server.js

      - name: Run database migrations
        run: npx sequelize-cli db:migrate --env test

      - name: Run tests
        run: npm test